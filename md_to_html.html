<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Markdown to HTML</title>
	<style>
		:root {
			color-scheme: light dark;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}

		body {
			margin: 0;
			padding: 24px;
			min-height: 100vh;
			box-sizing: border-box;
			background: Canvas;
			color: CanvasText;
		}

		h1 {
			margin: 0 0 16px;
			font-size: 1.4rem;
		}

		.container {
			display: grid;
			gap: 16px;
			max-width: 1100px;
			margin: 0 auto;
		}

		.box {
			width: 100%;
			min-height: 38vh;
			resize: vertical;
			box-sizing: border-box;
			padding: 14px;
			border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
			border-radius: 10px;
			background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
			color: CanvasText;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
			font-size: 0.95rem;
			line-height: 1.5;
		}

		.preview-box {
			height: 38vh;
			resize: vertical;
			box-sizing: border-box;
			padding: 14px;
			border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
			border-radius: 10px;
			background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
			color: CanvasText;
			overflow-y: auto;
			overflow-x: hidden;
			white-space: normal;
			overflow-wrap: anywhere;
			word-break: break-word;
		}

		.preview-box > :first-child {
			margin-top: 0;
		}

		.preview-box > :last-child {
			margin-bottom: 0;
		}

		.box:focus {
			outline: 2px solid Highlight;
			outline-offset: 1px;
		}

		label {
			font-weight: 600;
			display: block;
			margin-bottom: 8px;
		}

		input[type='file'] {
			padding: 8px;
			border: 1px solid color-mix(in srgb, CanvasText 35%, transparent);
			border-radius: 6px;
			background: color-mix(in srgb, Canvas 92%, CanvasText 8%);
			color: CanvasText;
			cursor: pointer;
		}
	</style>
	<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
	<main class="container">
		<h1>Markdown to HTML Converter</h1>

		<section>
			<label for="markdownInput">Markdown input</label>
			<div style="margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start;">
				<input type="file" id="markdownFile" accept=".md,.markdown,text/markdown" />
				<button id="clearButton" style="padding: 8px 12px; border: 1px solid color-mix(in srgb, CanvasText 35%, transparent); border-radius: 6px; background: color-mix(in srgb, Canvas 92%, CanvasText 8%); color: CanvasText; cursor: pointer; font-weight: 500;">Clear Markdown</button>
			</div>
			<textarea id="markdownInput" class="box" placeholder="# Paste Markdown here"></textarea>
		</section>

		<section>
			<label for="htmlPreview">HTML preview</label>
			<label style="font-weight: 400; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
				<input type="checkbox" id="paragraphModeCheckbox" style="margin: 0;" />
				Treat new lines as paragraphs
			</label>
			<div id="htmlPreview" class="preview-box" aria-live="polite"></div>
		</section>

		<section>
			<label for="htmlOutput">HTML output</label>
			<textarea id="htmlOutput" class="box" readonly placeholder="Converted HTML appears here"></textarea>
		</section>
	</main>

	<script>
		const markdownInput = document.getElementById('markdownInput');
		const markdownFile = document.getElementById('markdownFile');
		const clearButton = document.getElementById('clearButton');
		const htmlPreview = document.getElementById('htmlPreview');
		const htmlOutput = document.getElementById('htmlOutput');
		const paragraphModeCheckbox = document.getElementById('paragraphModeCheckbox');
		function escapeHtml(str) {
			return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		const LIST_LINE_RE = /^\s*[-*+]\s+/;
		const TABLE_LINE_RE = /^\s*\|/;

		// Single source of truth for the styling applied to rendered markdown,
		// shared between the standalone HTML output document and the live preview.
		const OUTPUT_CSS_RULES = [
			{ selector: 'body', body: 'font-family:"Arial";' },
			{ selector: 'th, td', body: 'padding: 5px; vertical-align: top;' }
		];

		function buildOutputStyle() {
			return OUTPUT_CSS_RULES.map(r => `${r.selector}{${r.body}}`).join('');
		}

		function buildPreviewStyle() {
			return OUTPUT_CSS_RULES.map(r => {
				const scopedSelectors = r.selector.split(',')
					.map(s => s.trim())
					.map(s => s === 'body' ? '#htmlPreview' : `#htmlPreview ${s}`)
					.join(', ');
				return `${scopedSelectors}{${r.body}}`;
			}).join('\n');
		}

		document.head.insertAdjacentHTML('beforeend', `<style>${buildPreviewStyle()}</style>`);

		// Force a line break (or paragraph break, if useParagraphs) at every single line feed,
		// except within unordered list items and table rows, which rely on single line feeds
		// to stay part of the same list/table. That exception is itself skipped while inside
		// a raw HTML <td> tag, where line feeds should still be treated normally.
		function applyLineBreakRules(source, useParagraphs) {
			const lines = source.split('\n');
			let tdDepth = 0;
			let out = '';
			for (let i = 0; i < lines.length; i++) {
				const line = lines[i];
				out += line;

				const opens = (line.match(/<td\b[^>]*>/gi) || []).length;
				const closes = (line.match(/<\/td>/gi) || []).length;
				tdDepth = Math.max(0, tdDepth + opens - closes);

				if (i === lines.length - 1) break;

				const nextLine = lines[i + 1];
				if (line.trim() === '' || nextLine.trim() === '') {
					// Already a paragraph break; leave as-is.
					out += '\n';
					continue;
				}

				const isListContext = LIST_LINE_RE.test(line) || LIST_LINE_RE.test(nextLine);
				const isTableContext = TABLE_LINE_RE.test(line) || TABLE_LINE_RE.test(nextLine);
				const skip = (isListContext || isTableContext) && tdDepth === 0;

				if (skip) {
					out += '\n';
				} else if (useParagraphs) {
					out += '\n\n';
				} else {
					out += '  \n';
				}
			}
			return out;
		}

		function convertMarkdown() {
			let source = markdownInput.value;
			source = applyLineBreakRules(source, paragraphModeCheckbox.checked);

			const title = escapeHtml(source.trim().slice(0, 50));

			if (window.marked && typeof window.marked.parse === 'function') {
				let renderedHtml = window.marked.parse(source);
				// Remove disabled="" attribute from checkboxes to make them interactive
				renderedHtml = renderedHtml.replace(/\s+disabled=""/g, '');
				htmlOutput.value = `<html><head><title>${title}</title><style>${buildOutputStyle()}</style></head>\n<body>\n${renderedHtml}\n</body></html>`;
				htmlPreview.innerHTML = renderedHtml;
			} else {
				htmlOutput.value = source;
				htmlPreview.textContent = source;
			}
		}

		markdownInput.addEventListener('input', convertMarkdown);
		paragraphModeCheckbox.addEventListener('change', convertMarkdown);

		// Handle markdown file upload
		markdownFile.addEventListener('change', function(event) {
			const file = event.target.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function(e) {
					markdownInput.value = e.target.result;
					convertMarkdown();
				};
				reader.readAsText(file);
			}
		});

		// Handle clear button
		clearButton.addEventListener('click', function() {
			markdownInput.value = '';
			convertMarkdown();
		});

		convertMarkdown();
	</script>
</body>
</html>
